en:
  plugin_openproject_mattermost:
    name: "OpenProject Mattermost"
    description: "Post work package status to a Mattermost bot. Updates rewrite the same message (UP). Comments and files go to the thread. One bot, channel id per project."
  project_module_mattermost: "Mattermost"
  permission_manage_mattermost: "Manage Mattermost bot"
  label_mattermost: "Mattermost"
  label_mattermost_bot: "Bot connection (global)"
  label_mattermost_server_url: "Mattermost server URL"
  label_mattermost_bot_token: "Bot token"
  label_mattermost_bot_name: "Bot display name"
  label_mattermost_channel: "Where to inform"
  label_mattermost_channel_id: "Channel ID"
  label_mattermost_channel_name: "Channel name"
  label_mattermost_notify_mode: "Inform"
  label_mattermost_notify_group: "Project channel (group)"
  label_mattermost_notify_users: "Task members privately (DM)"
  label_mattermost_notify_both: "Both channel and private DMs"
  label_mattermost_routing: "What goes where"
  label_mattermost_test: "Test"
  label_mattermost_bump_on_status: "Rewrite the status card and UP it on status / dates / assignee"
  label_mattermost_pin_on_bump: "Pin the card after a bump"
  label_mattermost_thread_comments: "Push comments into the thread"
  label_mattermost_thread_files: "Push files into the thread"
  label_mattermost_thread_other: "Push other field changes into the thread"
  button_mattermost_test_bot: "Check bot token"
  button_mattermost_test_channel: "Send a test post to this channel"
  help_mattermost_server_url: "Base URL without /api/v4, for example https://chat.example.com. Shared by every project."
  help_mattermost_bot_token: "One bot token for the whole instance. Invite that same bot to every project channel. Saving with an empty token keeps the current token."
  help_mattermost_one_bot_many_channels: "The bot (server URL + token) is global. Each project chooses a channel and/or private DMs to task members."
  help_mattermost_channel_id: "Required for channel / both. Invite the bot, then copy Channel ID from Mattermost → channel info."
  help_mattermost_channel_name: "Optional label for humans (e.g. kitewell-release). The bot posts using the Channel ID above."
  help_mattermost_notify_mode: "Group posts in the project channel. Per user opens a Mattermost DM with each task member (assignee, accountable, author, watchers) using their OpenProject username. Both does each."
  help_mattermost_enable_module: "Enable the Mattermost module under Project settings → Modules, check Enabled above, and invite the bot to the channel if using group."
  help_mattermost_test_bot: "Calls Mattermost GET /users/me with the saved token. Does not post."
  help_mattermost_test_channel: "Sends a test post to the project channel and/or a DM to you, depending on Inform."
  notice_mattermost_bot_ok: "Bot token works. Logged in as %{name}."
  notice_mattermost_test_posted: "Test post sent (id %{post_id}). Check the Mattermost channel or your DM with the bot."
  activerecord:
    errors:
      messages:
        mattermost_channel_id_blank: "is required when Mattermost is enabled for this project"
